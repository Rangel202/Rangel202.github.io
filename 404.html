<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada · Gabriel Rangel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0e17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d96ff'/%3E%3Cstop offset='1' stop-color='%23ff9a5c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Consolas,monospace' font-size='26' font-weight='700' text-anchor='middle' fill='%230b0e17'%3EGR%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Página 404 no mesmo visual do portfólio: um terminal que não achou a rota. */
:root {
  --bg: #0b0e17;
  --surface: #121727;
  --surface-2: #1a2136;
  --line: #262f4a;
  --text: #e9edf7;
  --muted: #8f99b4;
  --primary: #6d96ff;
  --primary-ink: #0b0e17;
  --accent: #ff9a5c;
  --ok: #3ecf8e;
  --dot: rgba(143, 153, 180, 0.11);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #edf1f9;
    --line: #d9e0ee;
    --text: #0f1529;
    --muted: #56607a;
    --primary: #2f5bea;
    --primary-ink: #ffffff;
    --accent: #b84a12;
    --ok: #0f7a50;
    --dot: rgba(86, 96, 122, 0.13);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  display: grid;
  place-items: center;
  margin: 0;
  padding: 32px max(18px, env(safe-area-inset-right, 0px)) 32px max(18px, env(safe-area-inset-left, 0px));
  background-color: var(--bg);
  background-image:
    radial-gradient(560px 360px at 80% 10%, rgba(109, 150, 255, 0.14), transparent 70%),
    radial-gradient(460px 320px at 10% 90%, rgba(255, 154, 92, 0.12), transparent 70%),
    radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: auto, auto, 24px 24px;
  color: var(--text);
  font: 400 1rem / 1.6 "JetBrains Mono", ui-monospace, Consolas, monospace;
}
main { width: 100%; max-width: 640px; }
.big {
  margin: 0 0 18px;
  font: 800 clamp(4.5rem, 18vw, 8rem) / 0.9 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  letter-spacing: -0.04em;
  background: linear-gradient(100deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.shell { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.8); }
.bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 0.75rem; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i:nth-child(1) { background: var(--accent); opacity: 0.8; }
.dots i:nth-child(2) { background: var(--primary); opacity: 0.7; }
.dots i:nth-child(3) { background: var(--ok); opacity: 0.7; }
.body { padding: 20px 22px 24px; font-size: 0.9rem; }
.body p { margin: 0 0 6px; overflow-wrap: anywhere; }
.u { color: var(--ok); font-weight: 600; }
.p { color: var(--primary); font-weight: 600; }
.err { color: var(--accent); }
.dim { color: var(--muted); }
.caret { display: inline-block; width: 0.55em; height: 1.05em; vertical-align: -0.15em; background: var(--primary); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font: 700 0.85rem / 1.2 "JetBrains Mono", ui-monospace, Consolas, monospace; text-decoration: none; }
.btn:hover { border-color: var(--primary); }
.btn.primary { border-color: var(--primary); background: var(--primary); color: var(--primary-ink); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
</style>
</head>
<body>
<main>
  <p class="big" aria-hidden="true">404</p>
  <div class="shell">
    <div class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>gabriel@portfolio: ~</span></div>
    <div class="body">
      <p><span class="u">gabriel@portfolio</span>:<span class="p">~</span>$ cd <span id="rota">/pagina</span></p>
      <p class="err">bash: cd: rota não encontrada (erro 404)</p>
      <p class="dim">A página que você procurou não existe ou mudou de lugar.</p>
      <p><span class="u">gabriel@portfolio</span>:<span class="p">~</span>$ <span class="caret" aria-hidden="true"></span></p>
      <div class="actions">
        <a class="btn primary" href="/">← Voltar para o início</a>
        <a class="btn" href="/#projetos">Ver projetos</a>
        <a class="btn" href="/#contato">Contato</a>
      </div>
    </div>
  </div>
</main>
<script>
  // Mostra o endereço que a pessoa tentou abrir
  document.getElementById("rota").textContent = decodeURIComponent(location.pathname) || "/";
</script>
</body>
</html>
